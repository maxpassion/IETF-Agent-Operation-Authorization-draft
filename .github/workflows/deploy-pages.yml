name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install xml2rfc
      run: |
        pip install xml2rfc
    
    - name: Build HTML and TXT artifacts
      run: |
        make clean
        make all
    
    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Create index page
      run: |
        cat > drafts/html/index.html << 'INDEXHTML'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AOA IETF Drafts</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 50px auto; padding: 20px; }
        h1 { color: #24292e; border-bottom: 2px solid #eaecef; padding-bottom: 0.3em; }
        .draft-list { list-style: none; padding: 0; }
        .draft-item { background: #f6f8fa; margin: 10px 0; padding: 15px; border-radius: 6px; }
        .draft-item a { color: #0366d6; text-decoration: none; font-weight: 600; }
        .format-links a { color: #58a6ff; margin-right: 10px; }
    </style>
</head>
<body>
    <h1>📄 AOA IETF Internet-Drafts</h1>
    <ul class="draft-list">
        <li class="draft-item">
            <a href="draft-liu-agent-operation-authorization-00.html">draft-liu-agent-operation-authorization-00</a>
            <div class="format-links"><a href="../txt/draft-liu-agent-operation-authorization-00.txt">TXT</a></div>
        </li>
        <li class="draft-item">
            <a href="draft-liu-ai-agent-authorization-integration-00.html">draft-liu-ai-agent-authorization-integration-00</a>
            <div class="format-links"><a href="../txt/draft-liu-ai-agent-authorization-integration-00.txt">TXT</a></div>
        </li>
        <li class="draft-item">
            <a href="draft-liu-oauth-authorization-evidence-00.html">draft-liu-oauth-authorization-evidence-00</a>
            <div class="format-links"><a href="../txt/draft-liu-oauth-authorization-evidence-00.txt">TXT</a></div>
        </li>
        <li class="draft-item">
            <a href="draft-liu-oauth-chain-delegation-00.html">draft-liu-oauth-chain-delegation-00</a>
            <div class="format-links"><a href="../txt/draft-liu-oauth-chain-delegation-00.txt">TXT</a></div>
        </li>
        <li class="draft-item">
            <a href="draft-liu-oauth-rego-policy-00.html">draft-liu-oauth-rego-policy-00</a>
            <div class="format-links"><a href="../txt/draft-liu-oauth-rego-policy-00.txt">TXT</a></div>
        </li>
    </ul>
</body>
</html>
INDEXHTML
    
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./drafts/html

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
